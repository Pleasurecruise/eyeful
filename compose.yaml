services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: eyeful
      POSTGRES_PASSWORD: eyeful
      POSTGRES_DB: eyeful
    ports:
      - '5432:5432'
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'eyeful']
      interval: 2s
      retries: 30

  server:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EYEFUL_DATABASE_URL: postgres://eyeful:eyeful@postgres:5432/eyeful?sslmode=disable
    ports:
      - '8080:8080'
    profiles: [server]

volumes:
  postgres:
