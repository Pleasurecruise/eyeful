[tools]
go = "latest"
node = "latest"
pnpm = "latest"
golangci-lint = "latest"
python = "latest"

[env]
_.file = { path = ".env", redact = true }
_.path = ".tools/bin"
DOCS_URL = "https://github.you-find.me/"

[tasks.setup]
description = "Install Go and pnpm dependencies"
run = ["go mod download", "pnpm install"]

[tasks."generate:pulls"]
description = "Rebuild workflow/pulls/core.js from @pulls.review/core"
hide = true
run = "pnpm --filter @eyeful/pulls build"

[tasks."tools:wails"]
description = "Build the wails3 CLI that apps/desktop/go.mod pins into .tools/bin"
hide = true
dir = "apps/desktop"
env = { GOBIN = "{{config_root}}/.tools/bin" }
run = "go install tool"

[tasks."generate:bindings"]
description = "Regenerate the desktop's TypeScript bindings into apps/desktop/frontend/bindings"
hide = true
depends = ["tools:wails"]
dir = "apps/desktop"
run = "wails3 generate bindings -clean=true -ts"

[tasks.generate]
description = "Regenerate the pulls.review core bundle and the desktop bindings"
depends = ["generate:pulls", "generate:bindings"]

[tasks.skills]
description = "Reinstall the review skills in workflow/prompts/skills from skills-lock.json (skills.sh)"
run = """
set -e
tmp=$(mktemp -d)
cp workflow/prompts/skills-lock.json "$tmp/"
(cd "$tmp" && git init -q && npx --yes skills@1.7.0 experimental_install -y)
rm -rf workflow/prompts/skills
cp -R "$tmp/.agents/skills" workflow/prompts/skills
rm -rf "$tmp"
"""

[tasks."build:action"]
description = "Build the review and sandbox images the GitHub Action runs (needs Docker)"
run = [
	"docker build -t eyeful-action -f Dockerfile .",
	"docker build -t eyeful-sandbox -f Dockerfile.sandbox ."
]

[tasks."dev:docs"]
description = "Serve the documentation site with hot reload"
run = "pnpm --filter @eyeful/docs dev"

[tasks."build:docs"]
description = "Build the documentation site into docs/.vitepress/dist"
run = "pnpm --filter @eyeful/docs build"

[tasks.install]
description = "Install the local eyeful CLI into ~/.local/bin"
run = "GOBIN=$HOME/.local/bin go install -ldflags \"-X main.version=$(git describe --tags --always --dirty)\" ./cmd/eyeful"

[tasks."dev:desktop"]
description = "Run the desktop app with Wails live reload"
depends = ["tools:wails"]
dir = "apps/desktop"
run = "wails3 dev -config ./build/config.yml"

[tasks."package:desktop"]
description = "Package the desktop app (.app, installer, AppImage) for this OS"
depends = ["tools:wails"]
dir = "apps/desktop"
run = "wails3 package"

[tasks.test]
description = "Run Go tests with the race detector, and the evaluation scripts' tests"
run = [
	"for m in . workflow local; do (cd $m && go test -race -p 1 ./...) || exit 1; done",
	"cd eval && python3 -m unittest --quiet test_eval"
]

[tasks.lint]
description = "Check formatting and lint Go and TypeScript"
depends = ["generate:bindings"]
run = [
	"for m in . workflow local apps/desktop; do (cd $m && golangci-lint run ./...) || exit 1; done",
	"bash -c 'diff <(cd docs && ls *.md cloud/*.md) <(cd docs/zh && ls *.md cloud/*.md)'",
	"pnpm exec vp check",
	"pnpm --recursive --filter '!eyeful' run typecheck"
]

[tasks.format]
description = "Format Go and TypeScript"
run = [
	"for m in . workflow local apps/desktop; do (cd $m && golangci-lint fmt ./...) || exit 1; done",
	"pnpm exec vp fmt"
]

[tasks.check]
description = "Lint, test, and fail if generated files are stale"
depends = ["lint", "test", "generate"]
run = "git diff --exit-code -- workflow/pulls/core.js"
