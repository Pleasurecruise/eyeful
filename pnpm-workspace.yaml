packages:
  - apps/desktop/frontend
  - 'packages/*'
  - docs

saveExact: true
allowBuilds:
  '@google/genai': false
  esbuild: false
  protobufjs: false
engineStrict: true

update:
  ignoreDeps:
    - typescript
catalog:
  '@inlang/paraglide-js': 3.2.2
  svelte: 5.59.0
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
