packages:
  - 'apps/*'
  - apps/desktop/frontend
  - 'packages/*'
  - docs

saveExact: true
allowBuilds:
  '@google/genai': false
  esbuild: false
  protobufjs: false
engineStrict: true

update:
  ignoreDeps:
    - typescript
catalog:
  '@inlang/paraglide-js': 2.25.4
  svelte: 5.57.1
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
minimumReleaseAgeExclude:
  - '@pulls.review/core@0.3.1'
