packages:
  - 'apps/*'
  - apps/desktop/frontend
  - 'packages/*'
  - docs

saveExact: true
engineStrict: true

update:
  ignoreDeps:
    - typescript
catalog:
  '@inlang/paraglide-js': 2.25.4
  svelte: 5.57.1
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
