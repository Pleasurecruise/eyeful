packages:
  - apps/desktop/frontend
  - 'packages/*'
  - docs

saveExact: true
allowBuilds:
  '@google/genai': false
  esbuild: false
  protobufjs: false
engineStrict: true

update:
  ignoreDeps:
    - typescript
catalog:
  '@inlang/paraglide-js': 2.29.2
  svelte: 5.57.3
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
