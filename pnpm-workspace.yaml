packages:
  - 'apps/*'
  - apps/desktop/frontend
  - 'packages/*'
  - cloud/web
  - cloud/sdk
  - docs

saveExact: true
allowBuilds:
  '@google/genai': false
  esbuild: false
  protobufjs: false
engineStrict: true

update:
  ignoreDeps:
    - typescript
catalog:
  '@inlang/paraglide-js': 2.27.0
  svelte: 5.57.2
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
